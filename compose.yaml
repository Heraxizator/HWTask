name: hwtask

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hwtask}
      POSTGRES_USER: ${POSTGRES_USER:-hwtask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hwtask} -d ${POSTGRES_DB:-hwtask}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 120s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hwtask}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hwtask}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      # Обязателен непустой секрет; иначе Spring не сможет создать JwtProperties (см. .env.example).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env e.g. openssl rand -base64 48}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    volumes:
      - hwtask_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data: {}
  hwtask_app_data: {}
