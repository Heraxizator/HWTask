spring:
  application:
    name: HWTask
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    # Jackson 3 (Spring Boot 4): see https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Секреты JWT и путь вложений задаются в профильных файлах (dev / docker / prod / test), не здесь.
hwtask:
  reminders:
    poll-interval-ms: 60000

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
