# OpenAPI/Swagger отключены в prod по умолчанию; для внутренней среды включите:
# springdoc.api-docs.enabled=true и springdoc.swagger-ui.enabled=true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

hwtask:
  security:
    allow-bearer-header: false
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    cookie:
      access-name: ${HWTASK_AUTH_ACCESS_COOKIE:hwtask_access}
      refresh-name: ${HWTASK_AUTH_REFRESH_COOKIE:hwtask_refresh}
      access-ttl-seconds: ${HWTASK_AUTH_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${HWTASK_AUTH_REFRESH_TTL_SECONDS:2592000}
      secure: ${HWTASK_AUTH_COOKIE_SECURE:true}
      same-site: ${HWTASK_AUTH_COOKIE_SAMESITE:Lax}
      domain: ${HWTASK_AUTH_COOKIE_DOMAIN:}
  storage:
    attachments-dir: ${HWTASK_ATTACHMENTS_DIR:/data/attachments}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState
