spring:
  config:
    activate:
      on-profile: docker
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

# Секреты только из окружения (см. compose / .env). Без JWT_SECRET приложение не стартует.
hwtask:
  security:
    allow-bearer-header: false
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    cookie:
      access-name: ${HWTASK_AUTH_ACCESS_COOKIE:hwtask_access}
      refresh-name: ${HWTASK_AUTH_REFRESH_COOKIE:hwtask_refresh}
      access-ttl-seconds: ${HWTASK_AUTH_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${HWTASK_AUTH_REFRESH_TTL_SECONDS:2592000}
      secure: ${HWTASK_AUTH_COOKIE_SECURE:false}
      same-site: ${HWTASK_AUTH_COOKIE_SAMESITE:Lax}
      domain: ${HWTASK_AUTH_COOKIE_DOMAIN:}
  storage:
    attachments-dir: /data/attachments

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
