spring:
  docker:
    compose:
      enabled: true
      file: compose.yaml
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Локальная разработка: можно задать JWT_SECRET в .env / окружении; иначе — слабый dev-дефолт (только для dev).
hwtask:
  jwt:
    secret: ${JWT_SECRET:LOCAL_DEV_ONLY_01234567890123456789012345678901234567890123456789012345678901234}
    expiration-ms: 86400000
  storage:
    attachments-dir: ${HWTASK_ATTACHMENTS_DIR:./data/attachments}

management:
  endpoints:
    web:
      exposure:
        include: health, info
